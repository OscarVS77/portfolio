<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-SbruTA60RsOwFa3HrLp1U9U1BLJ2Cv7X6oxXBrktV78='; style-src 'sha256-jDxEGOzwAlAFRDDSSZ8+UJITC6rpz7w6ustOGHdIAns='; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Portfolio Oscar</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08090c}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#f0f2f4;-webkit-font-smoothing:antialiased}
.tarjeta{width:100%;max-width:520px;background:#111419;border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:36px 32px 32px}
.marca{margin:0 0 18px;font-size:13px;font-weight:600;letter-spacing:.01em;color:#a8b2c0}
h1{margin:0 0 12px;font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.texto{margin:0 0 26px;font-size:16px;line-height:1.5;color:#c9d0da}
.boton{display:block;width:100%;padding:14px 18px;border-radius:12px;background:#e7ecf3;color:#08090c;font-size:16px;font-weight:600;text-align:center;text-decoration:none}
.boton:hover{background:#ffffff}
.estado{margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.07)}
.linea{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px;line-height:1.5;color:#c9d0da}
.punto{flex:none;width:9px;height:9px;margin-top:6px;border-radius:50%}
.verde .punto{background:#4ade9a}
.gris .punto{background:#a8b2c0}
.ambar .punto,.sin-comprobar .punto{background:#e8a33c}
.reintentar{margin:14px 0 0 19px;padding:8px 14px;border:1px solid rgba(255,255,255,0.18);border-radius:10px;background:transparent;color:#f0f2f4;font:inherit;font-size:14px;cursor:pointer}
@media (max-width:600px){
  body{padding:0;align-items:stretch}
  .tarjeta{max-width:none;min-height:100vh;border-radius:0;border-left:0;border-right:0;padding:56px 22px 32px}
}
</style>
</head>
<body>
<main class="tarjeta">
  <p class="marca">Portfolio Oscar</p>
  <h1>El portfolio se ha mudado</h1>
  <p class="texto">Ahora está en portfolio.oscarvisa.com.</p>
  <a class="boton" href="https://portfolio.oscarvisa.com/">Ir a portfolio.oscarvisa.com</a>
  <div class="estado" id="estado" hidden>
    <p class="linea" id="linea"><span class="punto"></span><span id="texto"></span></p>
    <button class="reintentar" id="reintentar" type="button" hidden>Reintentar</button>
  </div>
</main>
<script>
(function () {
  "use strict";
  // Lo que se borra, según el inventario de TODAS las versiones que ha servido
  // oscarvisa.com (scripts/medicion/f83/inventario_almacen.py, SE_BORRAN): lo del
  // portfolio —sus claves empiezan por «portfolio»: el libro, su ficha, las fechas y las
  // de marzo a julio de 2026; o son la sesión de su proyecto de Supabase— y la única
  // clave de «Portfolio Familia», la web retirada en marzo de 2026. La web de vehículos
  // no usa ninguna de esas formas (su Supabase es otro proyecto y no guarda sesión).
  var A_BORRAR = [/^portfolio/, /^sb-epkqzpjypnkblghlthyq-/, /^familia_v1$/];
  var EL_LIBRO = ["portfolioOscar:lastWorkbook:v1", "portfolio_v3"];
  var seBorra = function (k) {
    return A_BORRAR.some(function (r) { return r.test(k); });
  };
  var almacenes = function () { return [window.localStorage, window.sessionStorage]; };
  var clavesDe = function (a) {
    var ks = [];
    for (var i = 0; i < a.length; i++) ks.push(a.key(i));
    return ks;
  };
  var quedan = function () {
    var r = [];
    almacenes().forEach(function (a) {
      clavesDe(a).forEach(function (k) { if (seBorra(k)) r.push(k); });
    });
    return r;
  };
  // El texto habla sólo del libro del portfolio; lo demás se borra sin nombrarlo.
  var TEXTOS = {
    verde: "Este navegador guardaba una copia del libro. Ya está borrada.",
    gris: "Este navegador no guardaba ninguna copia del libro.",
    ambar: "No se ha podido borrar la copia del libro que guarda este navegador. Sigue aquí.",
    "sin-comprobar": "No se ha podido comprobar si este navegador guarda una copia del libro."
  };
  var CON_REINTENTO = { ambar: true, "sin-comprobar": true };
  var pinta = function (estado) {
    document.getElementById("linea").className = "linea " + estado;
    document.getElementById("texto").textContent = TEXTOS[estado];
    document.getElementById("reintentar").hidden = !CON_REINTENTO[estado];
    document.getElementById("estado").hidden = false;
    document.documentElement.setAttribute("data-estado", estado);
  };
  var corre = function () {
    var habiaLibro;
    try {
      habiaLibro = EL_LIBRO.some(function (k) { return window.localStorage.getItem(k) !== null; });
    } catch (e) {
      pinta("sin-comprobar");   // no deja ni leer: no se sabe si hay copia
      return;
    }
    try {
      almacenes().forEach(function (a) {
        clavesDe(a).filter(seBorra).forEach(function (k) {
          try { a.removeItem(k); } catch (e) { /* lo dice la comprobación de abajo */ }
        });
      });
    } catch (e) { /* lo dice la comprobación de abajo */ }
    // Sólo se afirma lo que se ha comprobado: se vuelve a mirar.
    var resto;
    try {
      resto = quedan();
    } catch (e) {
      pinta("sin-comprobar");   // se ha intentado, pero no se puede comprobar
      return;
    }
    // «Sigue aquí» sólo cuando se ha visto que sigue.
    pinta(resto.length ? "ambar" : (habiaLibro ? "verde" : "gris"));
  };
  document.getElementById("reintentar").addEventListener("click", corre);
  corre();
})();
</script>
</body>
</html>
